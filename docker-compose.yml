services:
  db:
    image: postgres:15-alpine
    container_name: buildpro_db
    environment:
      POSTGRES_DB: buildpro_pos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      # Host 5435 -> container 5432 (Postgres listens on 5432 inside the container).
      # Kept off 5432/5433 so it does not clash with a Postgres already installed on the host.
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d buildpro_pos"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend_django
    container_name: buildpro_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo --if-empty &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend_django:/app
    env_file:
      - path: ./backend_django/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- Optional: share the POS with a CPMS on ANOTHER computer ----
  # Off by default. scripts/start-tunnel.(sh|ps1) starts these two with
  # `--profile tunnel`. Only the gateway is exposed, and it lets through just the
  # CPMS sign-in and /api/v1/integration/cpms/ routes, with a secret key.
  gateway:
    image: nginx:1.27-alpine
    container_name: buildpro_tunnel_gateway
    profiles: ["tunnel"]
    env_file:
      - path: ./tunnel/gateway.env
        required: false
    volumes:
      - ./tunnel/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./tunnel/10-require-key.sh:/docker-entrypoint.d/10-require-key.sh:ro
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: buildpro_tunnel
    profiles: ["tunnel"]
    # Free Quick Tunnel: prints a random https://<name>.trycloudflare.com URL.
    # IPv4 + http2 avoid networks that block QUIC/IPv6.
    command: tunnel --no-autoupdate --edge-ip-version 4 --protocol http2 --url http://gateway:8080
    depends_on:
      - gateway

volumes:
  postgres_data:
