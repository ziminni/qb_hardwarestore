services:
  db:
    image: postgres:15-alpine
    container_name: buildpro_db
    environment:
      POSTGRES_DB: buildpro_pos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      # Host 5435 -> container 5432 (Postgres listens on 5432 inside the container).
      # Kept off 5432/5433 so it does not clash with a Postgres already installed on the host.
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d buildpro_pos"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend_django
    container_name: buildpro_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend_django:/app
    env_file:
      - path: ./backend_django/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
