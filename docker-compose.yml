services:
  db:
    image: postgres:15-alpine
    container_name: buildpro_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: buildpro_pos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      # Host 5435 -> container 5432 (Postgres listens on 5432 inside the container).
      # Kept off 5432/5433 so it does not clash with a Postgres already installed on the host.
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d buildpro_pos"]
      interval: 3s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend_django
    container_name: buildpro_backend
    restart: unless-stopped
    # DJANGO_DEBUG=false in backend_django/.env switches to production: no demo
    # accounts, collected admin static files, gunicorn instead of the dev server.
    # One worker process (threaded) because the login lockout cache is per process.
    command: >
      sh -c "python manage.py migrate &&
             if [ \"$${DJANGO_DEBUG:-true}\" = false ]; then
               python manage.py collectstatic --noinput &&
               exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 8 --timeout 300;
             else
               python manage.py seed_demo --if-empty &&
               exec python manage.py runserver 0.0.0.0:8000;
             fi"
    volumes:
      - ./backend_django:/app
    env_file:
      - path: ./backend_django/.env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ---- Optional: share the POS with a CPMS on ANOTHER computer ----
  # Off by default. scripts/start-tunnel.(sh|ps1) starts these two with
  # `--profile tunnel`. Only the gateway is exposed, and it lets through just the
  # CPMS sign-in and /api/v1/integration/cpms/ routes, with a secret key.
  gateway:
    image: nginx:1.27-alpine
    container_name: buildpro_tunnel_gateway
    restart: unless-stopped
    profiles: ["tunnel"]
    env_file:
      - path: ./tunnel/gateway.env
        required: false
    # Refuse to start without a real key: a missing one would leave the literal
    # "${QB_GATEWAY_KEY}" in the config as a guessable key.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ "$${#QB_GATEWAY_KEY}" -lt 24 ]; then
          echo "QB_GATEWAY_KEY is missing or shorter than 24 characters; run scripts/start-tunnel first." >&2
          exit 1
        fi
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    volumes:
      - ./tunnel/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - backend

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: buildpro_tunnel
    restart: unless-stopped
    profiles: ["tunnel"]
    # The cloudflared image is distroless (no /bin/sh), so the mode cannot be chosen
    # by a shell inside the container. scripts/start-tunnel.{sh,ps1} choose it: when
    # CLOUDFLARE_TUNNEL_TOKEN is set in tunnel/gateway.env they export it plus
    # CLOUDFLARED_TUNNEL_ARGS=run, giving a permanent Cloudflare Named Tunnel (fixed
    # hostname, e.g. https://pos-api.yourdomain.com -> http://gateway:8080).
    # Otherwise this runs a free Quick Tunnel (*.trycloudflare.com).
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate --edge-ip-version 4 --protocol http2 ${CLOUDFLARED_TUNNEL_ARGS:---url http://gateway:8080}
    depends_on:
      - gateway

volumes:
  postgres_data:
